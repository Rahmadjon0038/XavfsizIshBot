services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/safety.sqlite3
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 8

volumes:
  bot-data:
